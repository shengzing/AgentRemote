<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M5Stick S3 Simulator</title>
    <link rel="stylesheet" href="/m5/m5.css">
</head>
<body>
    <div class="m5-device">
        <div class="m5-screen" id="screen">
            <div class="m5-screen-content">
                <div id="screen-title" class="screen-title">CC Companion</div>
                <div id="screen-body" class="screen-body">按按钮唤醒</div>
                <div id="screen-footer" class="screen-footer"></div>
            </div>
        </div>
        <div class="m5-buttons">
            <button id="m5-btn-a" class="m5-btn">
                <span>A</span>
            </button>
            <button id="m5-btn-b" class="m5-btn m5-btn-b">
                <span>B</span>
            </button>
        </div>
    </div>

    <div class="info-panel">
        <div class="info-title">操作说明</div>
        <ul class="gesture-list">
            <li><kbd>A 单击</kbd> 切换选择 / 发送</li>
            <li><kbd>A 长按</kbd> 开始录音</li>
            <li><kbd>B 单击</kbd> 进入终端 / 返回 / 取消</li>
        </ul>
        <div class="state-indicator">
            状态: <span id="state-label">IDLE</span>
        </div>
        <div id="feedback" class="feedback"></div>
    </div>

    <script src="/m5/m5.js"></script>
</body>
</html>
